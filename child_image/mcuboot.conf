# Stock nRF53 two-image MCUboot profile proven by the firmware flash map.
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_BOOT_UPGRADE_ONLY=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
# CONFIG_FLASH_SIMULATOR_STATS is not set

# must agree with the app (partition manager): rpmsg_nrf53_sram is 8 KB (r2_kcfg)
CONFIG_RPMSG_NRF53_SRAM_SIZE=0x2000
