# Baseline configuration - being refined against the shipped v1.63 image.
CONFIG_SIZE_OPTIMIZATIONS=y

# C library / FP
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Kernel
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_SPIN_VALIDATE=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_EVENTS=y
# _system_heap (.data 0x20003978): init_bytes 0x10000, kheap buffer 0x20032868..0x20042868 (r2_kcfg)
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_RING_BUFFER=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_POSIX_API=y
CONFIG_PM_DEVICE=y

# Logging / console
CONFIG_LOG=y
CONFIG_PRINTK=y

# Buses and drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_WATCHDOG=y
CONFIG_NRFX_SPIM3=y
CONFIG_NRFX_SPIM4=y
CONFIG_NRFX_PDM=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_MFD_NPM1300=y
CONFIG_GPIO_NPM1300=y
CONFIG_WDT_NPM1300=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM1300=y
CONFIG_NPM1300_CHARGER=y
CONFIG_OPT3001=y
CONFIG_NRF_FUEL_GAUGE=y

# Storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_ANCS_CLIENT=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_CONN_TX_MAX=10
# prep_pool buf_count 2 (.data 0x20003dbc); att.c reassembled_data size MIN(512, 2*498) = 0x200 (r2_kcfg)
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_LONG_WQ=y

# IPC with the network core
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# Crypto
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_TINYCRYPT_AES_CMAC=y
CONFIG_TINYCRYPT_SHA256=y
CONFIG_TINYCRYPT_SHA256_HMAC=y
CONFIG_TINYCRYPT_SHA256_HMAC_PRNG=y

# Audio codec
CONFIG_LIBLC3=y

# DFU over BLE (SMP)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=3
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_NRF53_UPGRADE_NETWORK_CORE=y
CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y

# ---- Kconfig tuning against the v1.63 image  ----
# OpenAMP: app core is VIRTIO driver (host) only (rpmsg_virtio_*, virtqueue_*)
CONFIG_OPENAMP_SLAVE=n
# zcbor: ZCBOR_CHECK_ERROR()/zcbor_error() calls in every encode/decode fn
CONFIG_ZCBOR_STOP_ON_ERROR=y
# BT: L2CAP SDU RX MTU 0x1f0 (496) => ACL RX 502; ATT MTU 0x1f2 (498)
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498
# BT: le_phy_update_complete / le_data_len_change store + notify
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# UARTE: uarte_nrfx_data has async ptr at +0xc (no int_driven); poll_in/poll_out async paths
CONFIG_UART_ASYNC_API=y
# k_sys_work_q_init: stack 0x1000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# smp_bt_setup: two k_work_init_delayable (conn_param_on_pref_restore, le_conn_param_req)
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
# commit_settings/set_setting: "name" setting + bt_set_name("Even G1"), name[28+1]
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME="Even G1"
# bt_buf_get_rx: single hci_rx_pool (no evt/acl_in split)
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
# update_keys_check: unauthenticated keys may be overwritten
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# qspi_nor_write: on-stack bounce buffer 16 bytes
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
# boot_swap_type_multi: BOOT_LOG_INF compiled out, "mcuboot_util" module still registered
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
# SDK modules present in the image (bt_gattp_*, bt_nus_send, os_mgmt handlers, sys_poweroff)
CONFIG_BT_GATTP=y
CONFIG_BT_NUS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_POWEROFF=y
# bt_ancs_client: notif attr list at +0x1060 => cp_data[4096]
CONFIG_BT_ANCS_CLIENT_CP_BUFF_SIZE=4096
# bt_le_adv_start: limited-adv timeout K_SECONDS(120) = 0x3c0000 ticks
CONFIG_BT_LIM_ADV_TIMEOUT=120
# z_impl_sys_rand32_get from rand32_entropy_device.c on crypto@50844000 (entropy_cc3xx)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# cJSON (NCS lib) used by the whitelist/BLE protocol code (parse_string, cJSON_* in the image)
CONFIG_CJSON_LIB=y

# CAF (integration): app_event_manager, module_state_event (main.c reports
# MODULE_STATE_READY, PTR "main" in module_id_list) and the CAF power manager
# (power_manager_app_event_handler, power_down/wake_up events) are in the image.
CONFIG_CAF=y
CONFIG_CAF_POWER_MANAGER=y
# power_down: interval counter compared with 3 (TIMEOUT 3 s / 1 s); system_off only logs
# "System suspended" (STAY_ON); error timeout K_SECONDS(30) = default
CONFIG_CAF_POWER_MANAGER_STAY_ON=y
CONFIG_CAF_POWER_MANAGER_TIMEOUT=3
# zephyr_basic_mgmt_init / storage_erase_handler / zephyr_basic_group_translate_error_code in the image
CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y

# ---- Kconfig round 2 (r2_kcfg, evidence from target bytes) ----
# vprintk (0x4e46c) calls z_cbvprintf_impl(char_out, ...) directly; no z_log_vprintk /
# z_impl_z_log_msg_runtime_vcreate in the image
CONFIG_LOG_PRINTK=n
# acl_tx_pool buf_count 10 (.data 0x20003c1c); req_slab num_blocks 10 (= L2CAP_TX_BUF_COUNT default)
CONFIG_BT_BUF_ACL_TX_COUNT=10
# hci_cmd_pool data_size 0x72 = MAX(BT_BUF_EVT_RX_SIZE, BT_BUF_CMD_TX_SIZE) = 1+2+111
# (CONFIG_BT_BUF_CMD_TX_SIZE=110 would give the same bytes: both only size this pool here)
CONFIG_BT_BUF_EVT_RX_SIZE=111
# smp_bt_attrs (.data 0x200028e4): characteristic perms READ|WRITE (0x03 / 0x02), not *_AUTHEN
CONFIG_MCUMGR_TRANSPORT_BT_AUTHEN=n
# log_const_area (0x8b820..0x8ba50, 70 entries) also registers NRF_RPC, NRF_RPC_CBOR, NRF_RPC_OS,
# nrf_rpc_ipc, dk_buttons_and_leds, NRFX_SPIS and NRFX_UARTE (their code is all gc'd).  nrf_rpc +
# DK library are what the ESB/MPSL timeslot demo app enables (referenced_examples/esb_ble_mpsl_timeslot).
CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_DK_LIBRARY=y
# instance numbers are not visible in the image (only the gc'd nrfx_spis.c / nrfx_uarte.c log entries)
CONFIG_NRFX_SPIS2=y
CONFIG_NRFX_UARTE1=y
# log_const levels: qspi_nor 2, flash_nrf 2 (both CONFIG_FLASH_LOG_LEVEL)
CONFIG_FLASH_LOG_LEVEL_WRN=y
# mpu_regions SRAM_0 = PM sram_primary 0x20002000..0x2007e000 (r_limit 0x2007dfe0), i.e. the
# rpmsg_nrf53_sram PM partition is 8 KB (the IPC shm itself stays at DT sram0_shared 0x20070000)
CONFIG_RPMSG_NRF53_SRAM_SIZE=0x2000
# bt_get_appearance (0x84744) returns 0x341 (833)
CONFIG_BT_DEVICE_APPEARANCE=833
