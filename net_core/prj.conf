CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_FLASH_LOAD_OFFSET=0x8800
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y
CONFIG_SPIN_VALIDATE=y
CONFIG_SMP=n
# k_thread_name_set (0x103b916) is the -ENOSYS stub and k_thread.arch
# swap_return_value sits at +0x90 (z_impl_k_sem_give) only without names.
CONFIG_THREAD_NAME=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_FRONTEND=n
CONFIG_LOG_PRINTK=y
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_RESERVE=1
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_MBOX=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_SLAVE=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_LL_SOFTDEVICE_BUILD_TYPE_LIB=y
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y
CONFIG_BT_CTLR_LE_ENC=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y
CONFIG_ESB=y
CONFIG_ESB_DYNAMIC_INTERRUPTS=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=251
CONFIG_NRF_RPC=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_POSIX_API=y
CONFIG_FW_INFO=y
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_HEAP_MEM_POOL_SIZE=2560
CONFIG_SYS_HEAP_AUTO=y
CONFIG_MAIN_STACK_SIZE=1024
# k_sys_work_q_init (0x10391f4) passes stack size 0x400
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
# SDC_CENTRAL_COUNT (= BT_MAX_CONN - SDC_PERIPHERAL_COUNT) is 1 in the shipped hci_driver_init
CONFIG_BT_MAX_CONN=2
# hci_raw pools (net_buf_fixed_* in shipped .rodata 0x103c96c..): cmd 32 x 69 B,
# acl 24 x 256 B, rx 10 x 507 B (= BT_BUF_ACL_SIZE(502)).
CONFIG_BT_BUF_CMD_TX_COUNT=32
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=1

# The shipped sdc_assertion_handler (0x103ae8e) tail-calls the vendor
# bt_ctlr_assert_handle (0x102b74c) in hci_rpmsg.c; stock hci_driver.c only
# does that with this option.
CONFIG_BT_CTLR_ASSERT_HANDLER=y

# Shipped SDC buffer cfg (literal in hci_driver_init) = tx/rx packet size 251,
# counts 3/2; mempool requirement check 0x16c3.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# hci_driver_open (0x1032228) calls sdc_default_tx_power_set(3) after the
# multithreading lock and sets the connection event length to 0x3d0900.
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=4000000

# The shipped SDC HCI wrapper set (0x1026e7c..) has no
# sdc_hci_cmd_cb_set_controller_to_host_flow_control / host_buffer_size /
# host_number_of_completed_packets: hci_internal.c built without ACL flow control.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n

# z_check_thread_stack_fail (0x102f4d8) and the fault.c MemManage stacking-error
# path exist with a 0x40 guard (MPU_GUARD_ALIGN_AND_SIZE) while
# arch_switch_to_main_thread still sets PSPLIM: both stack guards are enabled.
CONFIG_MPU_STACK_GUARD=y
